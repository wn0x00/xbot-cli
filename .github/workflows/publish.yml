name: Publish version tag

on:
  # Recovery: select the existing version tag, never main.
  workflow_dispatch:
  # Maintainers publish by pushing one version tag after its commit reaches main.
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false

      - name: Validate release tag, versions, repository and main ancestry
        run: node scripts/release-artifacts.cjs validate

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable

      - name: Install npm project
        run: npm ci --ignore-scripts

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build native executable
        run: npm run build

      - name: Test Rust and Node launcher
        run: npm test

      - name: Test development standards metadata checker
        run: python -B skills/xbot-development-standards/scripts/test_check_metadata.py

      - name: Pack and test installed package
        run: npm run test:package

      - name: Prepare release assets from the tested build
        id: package
        run: node scripts/release-artifacts.cjs prepare

      - name: Upload tested release assets
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tested npm archive with OIDC
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: x64
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm version
        run: |
          $npmTools = Join-Path $env:RUNNER_TEMP 'npm-cli'
          npm install --prefix $npmTools npm@11.21.1 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $npmCli = Join-Path $npmTools 'node_modules/npm/bin/npm-cli.js'
          $version = node $npmCli --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '11.21.1') { throw 'Required npm version is unavailable' }
          "npm_execpath=$npmCli" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download tested release assets
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/release
          merge-multiple: true

      - name: Verify and publish the tested archive
        env:
          RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: node scripts/release-publish.cjs npm

  github-release:
    name: Create GitHub Release and attach the tested artifacts
    needs: [build, publish]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false

      - name: Download tested release assets
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/release
          merge-multiple: true

      - name: Verify and upload release attachments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: node scripts/release-publish.cjs github
