[package]
name = "xbot-cli"
version = "0.12.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wn0x00/xbot-cli"
description = "面向 AI Agent 的影刀 RPA CLI：应用与指令集开发维护、流程运行和 Web/Windows 自动化，内置 CLI 文档、指令开发与维护三份 Skill"

[[bin]]
name = "xbot-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.22"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
