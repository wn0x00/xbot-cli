[package]
name = "xbot-cli"
version = "0.8.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/wn0x00/xbot-cli"
description = "影刀 RPA CLI:应用、流程、任务与工具的统一执行契约"

[[bin]]
name = "xbot-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
