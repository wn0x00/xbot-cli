[package]
name = "xbot-shim"
version = "0.1.0"
edition = "2021"

[lib]
name = "XbotShim"
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
]

